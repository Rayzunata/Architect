<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect ~ Idle</title>
    <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style/architect.css">
    <link rel="stylesheet" href="style/inventory.css">
    <link rel="stylesheet" href="style/worldSelection.css">
    <link rel="stylesheet" href="style/modal.css">
    <link rel="stylesheet" href="style/npcShop.css">
    <!-- STYLESHEETS AUFTEILEN-->
</head>
<body>

    <div class="headContainer" id="headContainer">
        <div class="logoContainer" id="logoContainer">
            <img src="./img/icons/logo.svg" class="logo"></img>
            <h2>~ ARCHITECT ~</h2>
        </div>
        <div class="testelementContainer" id="testelementContainer"><p>Current (Region/ Activity/ Skill) Info</p></div>
        <div class="settingsContainer" id="settingsContainer">
            <p>Utils etc.</p>
            <button class="saveButton" id="saveButton" title="speichern"></button>
            <button class="loadButton" id="loadButton" title="laden"></button>
            <button class="deleteButton" id="deleteButton" title="löschen"></button>
        </div>
    </div>
    <div class="gameContainer" id="gameContainer">

        <div class="leftContainer" id="leftContainer">

            <div class="entryLeftContainer" id="entryLeftContainer">

                <!-- <div class="testEintrag"><p>testEintragl</p>
                    
                </div> -->

                
                <button class="testEintrag button" id="button1" title="zeigt Inventar">createRandomItem()</button>
                <button class="testEintrag button" id="button2" title="zeigt Inventar">getItemFromID()</button>

            </div>

        </div>
        <div class="midContainer" id="midContainer">

            <div class="entryMidContainer" id="entryMidContainer">

                <!-- <div class="testEintrag"><p>testEintrag</p>

                </div> -->

            </div>

        </div>
        <div class="rightContainer" id="rightContainer">

            <div class="entryRightContainer" id="entryRightContainer">

                <!-- <div class="testEintrag"><p>testEintrag</p>

                </div> -->
                   
                <div class="" id="entryRightItemdetailsContainer">
                    <p>ITEMDETAILS</p>
                </div>

                <div class="entryRightLogContainer" id="entryRightLogContainer">
                    <p>LOG</p>
                </div>
                
            </div>

        </div>


    </div>
    
    <div class="footContainer" id="footContainer"><p>foot</p></div>

    <script type="module">

        import {createGame} from "./data/game/createGame.js";
        import {renderInventory} from "./ui/renderInventory.js";
        import {renderLeftNav} from "./ui/renderLeftNav.js";
        import {item} from "./systems/items/item.js";
        import {saveManager} from "./systems/saveManager.js";

        const game = createGame();


        renderLeftNav(game);

        

        //######################### randomitem creation test
        document.getElementById("button1").addEventListener("click", function () {

            item.addItemToInventory(item.createRandomItem(), game.player.inventory);
            if( game.ui.currentScreen === "inventory"){
                renderInventory(game.player.inventory)
            }
        });

        //######################### itemID to itemObject test
        document.getElementById("button2").addEventListener("click", function () {

            const testitem = item.getItemFromId("resource:stone:granite:shard:none:none:epic:61");
            console.log(testitem);
        });

        //######################### save
        document.getElementById("saveButton").addEventListener("click", function () {

            saveManager.save(game);
        });

        //######################### load
        document.getElementById("loadButton").addEventListener("click", function () {

            saveManager.load(game);
        });

        //######################### delete
        document.getElementById("deleteButton").addEventListener("click", function () {

            saveManager.delete();
            
        });

    </script>
</body>
</html>
